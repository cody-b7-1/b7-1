# 개발 전용: `docker compose up` 시 자동 병합됨
# 운영: docker compose -f docker-compose.yml up
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

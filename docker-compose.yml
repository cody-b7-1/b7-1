services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: "${DB_HOST_DOCKER}"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      APP_ENV: "${APP_ENV:-production}"
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: "local" #Docker 로그 드라이버 이름
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - backend_logs:/app/logs

  mariadb:
    image: mariadb:11
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "--password=${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build:
      context: ./frontend
    ports:
      - 443:443
    volumes:
      - ./infra/caddy:/etc/caddy:ro

volumes:
  mariadb_data:
  backend_logs:


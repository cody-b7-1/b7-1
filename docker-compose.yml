x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# DB는 로그량이 적으므로 작게 설정
x-logging-db: &db-logging
  driver: local
  options:
    max-size: "5m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DB_HOST: "${DB_HOST_DOCKER}"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      APP_ENV: "${APP_ENV:-production}"
    depends_on:
      mariadb:
        condition: service_healthy
    logging: *default-logging
    volumes:
      - ./logs:/app/logs

  mariadb:
    image: mariadb:11
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "--password=${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *db-logging
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build:
      context: ./frontend
    ports:
      - 80:80
      - 443:443
    logging: *default-logging
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - ${IMG_DIR:-/home/ubuntu/img}:/srv/img:ro

volumes:
  mariadb_data:

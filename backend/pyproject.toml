[project]
name = "philo-backend"
version = "0.1.0"
description = "Philo backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.0,<3",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.0,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pymysql>=1.1,<2",
    "PyJWT>=2.10,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn>=0.30,<1",
    "openai>=1.50,<2",
    "aiosmtplib>=3,<6",
]

[tool.uv]
required-version = ">=0.12"
